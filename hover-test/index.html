<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pencil hover test</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #1d1d1d; color: #ddd; font: 14px -apple-system, system-ui, sans-serif; overflow: hidden; }
  body { display: flex; flex-direction: column; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  header { padding: 10px 14px; background: #2b2b2b; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  #verdict { font-size: 20px; font-weight: 600; padding: 6px 12px; border-radius: 6px; background: #444; }
  #verdict.yes { background: #2e7d32; color: #fff; }
  button { font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid #666; background: #3a3a3a; color: #ddd; }
  main { flex: 1; display: flex; min-height: 0; }
  #area { flex: 1; position: relative; touch-action: none; background: #262626; border-right: 1px solid #444; }
  #area canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #hint { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); color: #777; text-align: center; pointer-events: none; }
  aside { width: 360px; display: flex; flex-direction: column; min-height: 0; }
  #live, #counts { padding: 10px 14px; border-bottom: 1px solid #444; white-space: pre; font: 12px ui-monospace, Menlo, monospace; }
  #log { flex: 1; overflow: auto; padding: 10px 14px; font: 11px ui-monospace, Menlo, monospace; white-space: pre; color: #aaa; }
</style>
</head>
<body>
<header>
  <span id="verdict">Hover: not detected yet</span>
  <button id="clear">Clear</button>
  <span id="agent"></span>
</header>
<main>
  <div id="area">
    <canvas id="canvas"></canvas>
    <div id="hint">Hold the Pencil just above the screen, without touching.<br>Ring = hover, filled dot = contact.</div>
  </div>
  <aside>
    <div id="live">Last event: none</div>
    <div id="counts"></div>
    <div id="log"></div>
  </aside>
</main>
<script>
// Page de test : vérifie si Safari sur iPad envoie à la page le survol de l'Apple Pencil (sans contact).
const POINTER_EVENTS = ['pointerover', 'pointerenter', 'pointerdown', 'pointermove', 'pointerup', 'pointercancel', 'pointerout', 'pointerleave'];
const OTHER_EVENTS = ['mousemove', 'touchstart', 'touchmove', 'touchend'];
const LOG_LINES = 200;

const area = document.getElementById('area');
const canvas = document.getElementById('canvas');
const context = canvas.getContext('2d');
const verdict = document.getElementById('verdict');
const live = document.getElementById('live');
const countsPanel = document.getElementById('counts');
const logPanel = document.getElementById('log');
const counts = {};
const logLines = [];
let trail = [];

document.getElementById('agent').textContent = navigator.userAgent.replace(/^Mozilla\/5\.0 /, '');

// Adapte le canvas à la taille réelle de la zone, en pixels de l'écran.
function resizeCanvas() {
  const ratio = window.devicePixelRatio || 1;
  canvas.width = area.clientWidth * ratio;
  canvas.height = area.clientHeight * ratio;
  context.setTransform(ratio, 0, 0, ratio, 0, 0);
  drawTrail();
}

// Indique si un événement pointer est un survol : aucun bouton appuyé et aucune pression.
function isHover(event) {
  return event.buttons === 0 && event.pressure === 0;
}

// Dessine les derniers points reçus : anneau pour le survol, point plein pour le contact.
function drawTrail() {
  context.clearRect(0, 0, area.clientWidth, area.clientHeight);
  for (const point of trail) {
    context.beginPath();
    context.arc(point.x, point.y, point.hover ? 10 : 5, 0, Math.PI * 2);
    if (point.hover) {
      context.strokeStyle = point.pen ? '#66bb6a' : '#42a5f5';
      context.lineWidth = 2;
      context.stroke();
    }
    else {
      context.fillStyle = point.pen ? '#ffa726' : '#ef5350';
      context.fill();
    }
  }
}

// Ajoute un point à la trace et la redessine.
function addTrailPoint(event, hover) {
  const bounds = area.getBoundingClientRect();
  trail.push({ x: event.clientX - bounds.left, y: event.clientY - bounds.top, hover, pen: event.pointerType === 'pen' });
  if (trail.length > 60) trail = trail.slice(-60);
  drawTrail();
}

// Compte un événement par nom et par type de pointeur, puis met à jour le tableau.
function countEvent(name) {
  counts[name] = (counts[name] || 0) + 1;
  countsPanel.textContent = Object.entries(counts).sort().map(([key, value]) => `${key.padEnd(26)} ${value}`).join('\n');
}

// Ajoute une ligne au journal, sans répéter à l'infini les mouvements identiques.
function logLine(text) {
  if (logLines[0]?.text === text) logLines[0].repeat++;
  else logLines.unshift({ text, repeat: 1 });
  if (logLines.length > LOG_LINES) logLines.length = LOG_LINES;
  logPanel.textContent = logLines.map(({ text, repeat }) => repeat > 1 ? `${text}  ×${repeat}` : text).join('\n');
}

// Lit un événement pointer : compteur, détails en direct, journal et verdict.
function onPointerEvent(event) {
  const hover = isHover(event);
  const kind = event.pointerType || 'unknown';
  countEvent(`${event.type} ${kind}${hover && event.type === 'pointermove' ? ' hover' : ''}`);
  live.textContent = [
    `Last event: ${event.type}`,
    `pointerType: ${kind}`,
    `buttons: ${event.buttons}   pressure: ${event.pressure.toFixed(3)}`,
    `altitudeAngle: ${event.altitudeAngle?.toFixed(3) ?? 'n/a'}   azimuthAngle: ${event.azimuthAngle?.toFixed(3) ?? 'n/a'}`,
    `tiltX: ${event.tiltX}   tiltY: ${event.tiltY}`,
    `x: ${event.clientX.toFixed(1)}   y: ${event.clientY.toFixed(1)}`,
  ].join('\n');
  logLine(`${event.type.padEnd(13)} ${kind.padEnd(6)} b=${event.buttons} p=${event.pressure.toFixed(2)}`);
  if (event.type === 'pointermove' || event.type === 'pointerdown') addTrailPoint(event, hover);
  if (kind === 'pen' && hover && event.type === 'pointermove') {
    verdict.textContent = 'Pencil hover: YES';
    verdict.classList.add('yes');
  }
}

// Note les autres événements, pour voir ce que Safari envoie en plus des pointer events.
function onOtherEvent(event) {
  countEvent(event.type);
  logLine(event.type);
}

// Remet le test à zéro.
function clearTest() {
  for (const key of Object.keys(counts)) delete counts[key];
  logLines.length = 0;
  trail = [];
  countsPanel.textContent = '';
  logPanel.textContent = '';
  live.textContent = 'Last event: none';
  verdict.textContent = 'Hover: not detected yet';
  verdict.classList.remove('yes');
  drawTrail();
}

for (const name of POINTER_EVENTS) area.addEventListener(name, onPointerEvent);
for (const name of OTHER_EVENTS) area.addEventListener(name, onOtherEvent, { passive: true });
document.getElementById('clear').addEventListener('click', clearTest);
window.addEventListener('resize', resizeCanvas);
resizeCanvas();
</script>
</body>
</html>
